name: Build VCAM iOS

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install ldid dpkg

      - name: Setup RootHide Theos & iOS SDKs
        run: |
          git clone --recursive https://github.com/roothide/theos.git $HOME/theos
          curl -fsSL https://github.com/theos/sdks/archive/master.zip -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk $HOME/theos/sdks/
          rm -rf sdks.zip sdks-master
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build Roothide deb
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Build Rootless deb
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vcam-packages
          path: packages/*.deb
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: packages/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create build tag
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          TAG="build-${GITHUB_RUN_ID}-${GITHUB_SHA:0:7}"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Successful build $TAG"
          git push origin "$TAG"
